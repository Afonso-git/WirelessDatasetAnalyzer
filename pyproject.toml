[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-dataset-analyzer"
version = "0.1.0"
description = "A privacy-conscious analysis pipeline for WiGLE CSV exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9",
]

[project.scripts]
wireless-analyzer = "wireless_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

